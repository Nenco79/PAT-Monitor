<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<!-- iOS reads neither the manifest's display nor its icons on every version, so
     these two say the same thing in Apple's own words: saved to the Home Screen
     the monitor opens with no browser chrome, and it opens with the drawing
     rather than with a screenshot of whatever room was on screen. -->
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- `black` and not `black-translucent`: translucent puts the page under the
     clock, and the top of the viewer is where the alert banner and the state
     line live. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#171512">
<title>PAT Monitor</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/icons.css">
</head>
<body>
<div class="viewer">
  <!-- The alert banner sits **above the video** and not among the details: it
       says something is wrong, and a thing like that goes where the eye falls
       first, not where one arrives by scrolling. role="alert" so that whoever
       uses a screen reader hears it without having to look for it.

       Empty and hidden until there is something to say: a line that is always
       there stops being read. -->
  <div class="alertbar" id="alertbar" role="alert" aria-live="assertive"></div>

  <div class="stage">
    <!-- playsinline is compulsory on iOS: without it Safari opens the player
         full screen and takes control of the page.
         muted at the start because autoplay with audio is blocked. -->
    <video id="video" autoplay playsinline muted></video>

    <div class="overlay">
      <span class="dot" id="dot"></span>
      <span id="state" data-i18n="viewer.state.connecting"></span>
      <!-- The viewer count sits here and not among the details: if access from
           outside the house is easy, knowing who is watching has to be just as
           easy. It stays empty when one is alone, because "1" is the normal case
           and a number that never changes stops being read. -->
      <span id="viewers"></span>
      <!-- **An indicator that moves says nothing to whoever cannot see it**, and
           it is the same reason the guided path's level meter has a role: this
           band is 84 px wide and 6 tall, and without `aria-valuetext` whoever
           uses a screen reader has no way of knowing whether the room is silent
           or somebody is crying. It is not a live region: it is read when asked
           for, not announced on every frame. -->
      <!-- **It is born "not measurable", not "silence".** While the gate is up
           nobody is measuring anything, and an empty track reads as a quiet
           room: it is the wrong trust in the worst place, the same one
           `showLevelUnknown` exists not to give. The class and the word are
           therefore already in the markup, and the first real reading takes them
           away. -->
      <span class="meter unknown" id="meter" role="meter"
            data-i18n-attr="aria-label:viewer.level.label aria-valuetext:viewer.level.unknown"
            aria-valuemin="-60" aria-valuemax="0" aria-valuenow="-60"><i id="level"></i></span>
    </div>

    <!-- Full screen. **It sits on the picture and not in the bar**, bottom
         right, which is where every player has already taught people to look
         for it — and where it costs the bar nothing: a command's label is worth
         about two hundred pixels of the single row's threshold, and this way
         that number is not even a question. The bar goes back to exactly the
         shape that was measured.

         **It is one node and it does not move.** In full screen the rail piles
         up from the bottom of this same corner, so this button is its last
         entry: pressing it does not send the eye anywhere else, which is the
         property a toggle wants above all. Two nodes — one for the bar, one for
         the picture — would have been the copy that diverges, and here it would
         have diverged in `aria-pressed`, that is, in the state.

         **It is inside the stage and before the veil**, so while the veil is up
         it is covered: there the only thing to do is let the audio through, and
         a second command competing with that one would be a choice offered
         where there is none.

         **Two glyphs, and only one shows.** The pair is chosen by
         `aria-pressed` in the stylesheet, exactly as "Details" chooses its
         arrow from `aria-expanded`: the state is written once, and the screen
         reader and the sheet read the same thing rather than a line of
         JavaScript that can forget one of them. `textContent` here would delete
         both — the trap this page has paid for four times. -->
    <button class="toggle on-video" id="fullscreen" aria-pressed="false"
            data-i18n-attr="title:viewer.fullscreen.enter">
      <svg class="ico i-open" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 8v-2a2 2 0 0 1 2 -2h2" />
        <path d="M4 16v2a2 2 0 0 0 2 2h2" />
        <path d="M16 4h2a2 2 0 0 1 2 2v2" />
        <path d="M16 20h2a2 2 0 0 0 2 -2v-2" />
      </svg>
      <svg class="ico i-close" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 19v-2a2 2 0 0 1 2 -2h2" />
        <path d="M15 5v2a2 2 0 0 0 2 2h2" />
        <path d="M5 15h2a2 2 0 0 1 2 2v2" />
        <path d="M5 9h2a2 2 0 0 0 2 -2v-2" />
      </svg><span data-i18n="viewer.fullscreen"></span></button>

    <div class="gate" id="gate">
      <button id="listen" data-i18n="viewer.gate.listen"></button>
      <p class="why" data-i18n="viewer.gate.why"></p>
    </div>
  </div>

  <p class="warnbox" id="warn"></p>

  <!-- Access from outside the house. It stays hidden until there is something to
       say, and "it works" is not something to say: when all is well it would
       repeat every night the address of the page one is already looking at. Then
       it drops among the details, where the address stays available to whoever
       has to pass it to somebody else. When a step is missing, though, it sits
       here, above the bar and always visible. `order` in the stylesheet moves
       it. -->
  <div class="remote" id="remote">
    <div class="remote-body">
      <div class="remote-text">
        <div class="remote-head">
          <span class="remote-label" data-i18n="viewer.remote.label"></span>
          <span class="remote-phase" id="r-phase">—</span>
        </div>
        <p class="remote-action" id="r-action"></p>
        <a class="remote-link" id="r-link" target="_blank" rel="noopener noreferrer"></a>
      </div>
      <!-- The QR code, with the same drawing as the onboarding's: the address on
           the left, the code on the right, in a column below 540 px. They are two
           ways of doing the same thing — getting there — and not two things to
           do, so they sit in one panel.

           It serves for the same reason as there and more so: the public address
           is a string nobody types by hand, and whoever opens the details is
           nearly always about to pass it to a phone they have in their hand at
           that moment. It appears **only** when there is an address: where there
           is a step to take the answer is the button, not a code. -->
      <img class="qr" id="r-qr" width="120" height="120" hidden
           data-i18n-attr="alt:viewer.remote.qr">
    </div>
  </div>

  <div class="bar">
    <!-- The commands sit in two sides, and the two sides **exist only on the
         single row**: below the threshold they are `display: contents`, that is,
         they are not there — the buttons go back to being direct children of the
         bar and the two-row layout is the same as before, row by row and pixel
         by pixel.

         They are needed because "in the centre" means the centre of the bar, not
         halfway between the neighbours, and the two ends are not the same width:
         349 px on the left against 174 on the right. With two spacers the group
         would sit 87 px off centre, and above all **it would move by 48 px when
         "Talk" appears** — a control sliding under the finger. With two `1fr`
         columns the centre is the centre, and it does not depend on what is at
         the sides.

         The threshold lives in the stylesheet and **is not repeated here**: it
         is a measured number, it changes when a label changes, and written in
         two places it diverges at the first person who remeasures it. -->
    <div class="side">
    <!-- Speaking into the room, and it is the **first** command of the bar: it
         is the only thing one does while watching, and the others — silencing,
         opening the details, leaving — are done before or after. Whoever looks
         for that button looks for it in a hurry, one-handed, in the dark.

         It is born hidden and appears only when the monitor has really laid the
         incoming track: a button that is always there and works sometimes is
         worse than one that appears when it is needed. Appearing first it moves
         all the others, and that is fine: it happens once, right after the
         negotiation, before anybody has had time to point a finger. -->
    <button class="toggle" id="talk" hidden
            data-i18n-attr="title:viewer.talk.start">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 5a3 3 0 0 1 3 -3a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3a3 3 0 0 1 -3 -3l0 -5" />
        <path d="M5 10a7 7 0 0 0 14 0" />
        <path d="M8 21l8 0" />
        <path d="M12 17l0 4" />
      </svg><span data-i18n="viewer.talk"></span></button>
    <!-- Recording by hand, beside "Talk": they are the two commands given
         **while** watching, and they sit together for that reason.

         **The label is "Clip", not "Record"**, and it says the thing rather than
         the gesture: what one gets by pressing is a file to go and look at, and
         the word is the same one the recordings page uses to name it. It also
         fits in half a label, which on a bar of five commands is not a detail —
         see the single row's threshold.

         Unlike "Talk" it is not born hidden and does not depend on the
         negotiation: the recording is done by the monitor, with the seconds it
         already has in the ring, so it works even before the picture arrives. It
         is also the case where it is needed most — if the video cannot be seen,
         the clip is the only way of knowing what was in the room.

         **The pill says recording is happening, and the label never moves**: it
         is the bar's rule, and here it counts double because that state is not
         the browser's but the room's — it arrives from /api/status, so whoever
         opens a second phone with the clip already going sees it too.

         Pressing again while it records **lengthens** the clip rather than
         stopping it, and that is what the tooltip says: a clip that can be
         interrupted halfway is a second way of deciding how long it lasts, and
         the length here is the event clips'. -->
    <button class="toggle" id="record" aria-pressed="false"
            data-i18n-attr="title:viewer.record.title">
      <!-- **The dot is filled and red, and it is the one icon that does not
           follow `currentColor`.** `icons.css`'s rule exists so that a glyph
           lights up with its pill without a second rule to keep in step; here
           the red **is** the meaning — it is the sign with which any device
           declares it is recording — and following it would make the button
           indistinguishable from the other three.

           The circle is ours and not the set's: a circle is not borrowed, and
           taking it from Tabler would mean an attribution for a geometry anybody
           would write the same way. The hue is `--c-rec`, declared on purpose:
           `--c-stop` is the brick of faults, and dressing the recording command
           in it would teach people to read as an alarm a thing that is perfectly
           fine. -->
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="7" />
      </svg><span data-i18n="viewer.record"></span></button>
    <!-- **A toggle, not a command that renames itself.** It was the last button
         of the bar to rewrite itself when pressed — "Silence the room" became
         "Listen to the room" — and from outside that reads as a different
         command appearing in place of the previous one, not as the same one now
         switched on. It does the same thing as the three detections and as
         "Talk": it says what state the monitor is in, so it carries the same
         pill and the same `aria-pressed`, and the label no longer moves. On
         means the room is silenced.

         **The label is one word and the object lives in the tooltip**, and it is
         a balance paid for once: "Silence" alone promised silence and delivered
         half of it — the alerts go on sounding, and that is deliberate, because
         whoever silences the hiss has not given up being warned — and it had
         been settled by writing "Silence the room". That line was the widest in
         the bar. Now the full promise is carried by `title`: whoever wonders
         finds it, and the bar fits on one row a good deal sooner. -->
    <!-- **The word moved into a span, and it had to.** This button carried
         `data-i18n` on itself, that is, its text arrived through
         `textContent` — and a glyph inside it would be deleted on the first
         round of the catalogue. It is the trap already paid for three times
         over, and the icon is needed here because on the rail of the
         full-screen mode there are no words at all.

         **The glyph is drawn on the rail only**, and that is a measurement and
         not a whim: in the bar it widened the left side by 24 px, which with
         two equal tracks is 48, and it moved the width below which the middle
         group starts sliding past the threshold. The stylesheet carries the
         numbers.

         **The glyph is the crossed-out speaker, and it stays the same lit or
         unlit.** It says the thing the button does, as the recording dot does;
         what says whether it is in force is the pill, which is the bar's rule.
         A plain speaker would have read as "sound on" exactly when the pill
         lights to mean the room has been silenced. -->
    <button class="toggle" id="mute" aria-pressed="false"
            data-i18n-attr="title:viewer.mute.title">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 8a5 5 0 0 1 1.912 4.934m-1.377 2.602a5 5 0 0 1 -.535 .464" />
        <path d="M17.7 5a9 9 0 0 1 2.362 11.086m-1.676 2.299a9 9 0 0 1 -.686 .615" />
        <path d="M9.069 5.054l.431 -.554a.8 .8 0 0 1 1.5 .5v2m0 4v8a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l1.294 -1.664" />
        <path d="M3 3l18 18" />
      </svg><span data-i18n="viewer.mute.silence"></span></button>
    </div>
    <!-- What the monitor has to watch and listen for. Toggles and not a silence
         command: whoever has no dog switches barking off and never hears it get
         it wrong, rather than hearing it and silencing it.

         They start off **and inert**: their real state arrives with the first
         reading of /api/status, and showing a colour before knowing it means
         showing a wrong one. The pill tells them apart from the commands beside
         them — those do a thing, these say how it is. -->
    <!-- The three toggles sit in a group of their own, and it is not only
         layout: the bar's other buttons do a thing, these say how the monitor
         has to be. Grouped, the bar reads as two things instead of seven, and on
         a phone the group wraps whole instead of breaking wherever it happens
         to. -->
    <div class="detectors" role="group"
         data-i18n-attr="aria-label:viewer.detectors.group">
      <!-- The icons are Tabler Icons, MIT, taken verbatim: `mood-cry`, `dog`,
           `walk`, `microphone` on the "Talk" button, `volume-off` on "Mute" —
           drawn on the full-screen rail alone — and `maximize`/`minimize` on
           the full-screen command. The licence is in
           `licenses/manually-added/tabler-icons/`, like libopus — it is somebody
           else's work that we ship, and there is no tool that can find it for
           us.

           They draw **what the signal does**, not the sensor: three drawings of
           the sensor would all resemble each other, and then they would
           distinguish nothing, which is the only reason an icon is worth the
           room it takes.

           The stroke is `currentColor`, so the icon lights up with the pill
           without a second rule to keep in step with the first. -->
      <button class="toggle" id="d-cry" disabled
              data-i18n-attr="title:viewer.cry.title">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 10l.01 0" />
          <path d="M15 10l.01 0" />
          <path d="M9.5 15.25a3.5 3.5 0 0 1 5 0" />
          <path d="M17.566 17.606a2 2 0 1 0 2.897 .03l-1.463 -1.636l-1.434 1.606" />
          <path d="M20.865 13.517a8.937 8.937 0 0 0 .135 -1.517a9 9 0 1 0 -9 9c.69 0 1.36 -.076 2 -.222" />
        </svg><span data-i18n="viewer.cry"></span></button>
      <button class="toggle" id="d-bark" disabled
              data-i18n-attr="title:viewer.bark.title">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 5h2" />
          <path d="M19 12c-.667 5.333 -2.333 8 -5 8h-4c-2.667 0 -4.333 -2.667 -5 -8" />
          <path d="M11 16c0 .667 .333 1 1 1s1 -.333 1 -1h-2" />
          <path d="M12 18v2" />
          <path d="M10 11v.01" />
          <path d="M14 11v.01" />
          <path d="M5 4l6 .97l-6.238 6.688a1.021 1.021 0 0 1 -1.41 .111a.953 .953 0 0 1 -.327 -.954l1.975 -6.815" />
          <path d="M19 4l-6 .97l6.238 6.688c.358 .408 .989 .458 1.41 .111a.953 .953 0 0 0 .327 -.954l-1.975 -6.815" />
        </svg><span data-i18n="viewer.bark"></span></button>
      <button class="toggle" id="d-motion" disabled
              data-i18n-attr="title:viewer.motion.title">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
          <path d="M7 21l3 -4" />
          <path d="M16 21l-2 -4l-3 -3l1 -6" />
          <path d="M6 12l2 -3l4 -1l3 3l3 1" />
        </svg><span data-i18n="viewer.motion"></span></button>
    </div>
    <!-- The spacer before "Details", not after: they are the two entries that
         sit on the right, one because it opens a section and the other because
         it is the last thing one does. It is needed on the **two rows**, where
         it pushes both to the end of the lower row; on the single row it is not
         there, because there it is the column that pushes them to the end. -->
    <span class="spacer"></span>
    <div class="side end">
    <!-- The arrow says **what happens when pressed**, not how it is now: down
         when the section is closed and it is about to be opened, up when it is
         open and it is about to be closed again. They are two glyphs and only
         one appears, chosen by `aria-expanded` in the stylesheet: that way the
         state is written once, where a screen reader reads it too, rather than
         in a line of JavaScript that can forget it. -->
    <button class="ghost" id="details" aria-expanded="false"
            aria-controls="stats">
      <svg class="ico i-open" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 9l6 6l6 -6" />
      </svg>
      <svg class="ico i-close" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 15l6 -6l6 6" />
      </svg><span data-i18n="viewer.details"></span></button>
    <button class="ghost" id="logout" data-i18n="viewer.logout"></button>
    </div>
  </div>

  <div class="stats" id="stats">
    <!-- **What can be pressed comes first, and what is only read follows.**
         Two of these rows are not readings: they are the choice of which
         camera and which microphone the monitor uses, the only controls that
         live in this panel rather than on the bar. Whoever opens the details
         in order to *do* something is looking for them, and a control halfway
         down a list of fifteen numbers is not found, it is come across.
         The rest of the order is unchanged, and the version has gone to the
         bottom: it is read once, by whoever is reporting something, and it is
         the one row that says the same thing every night. -->
    <!-- **Three groups, and the dividers carry a word.** Fourteen readings of
         the same weight are a list one reads to the end or not at all; a rule
         with a label above it says where an argument starts, and it separates
         for free the two rows that are **pressed** from the twelve that are
         read. The label is the eyebrow this sheet already has — the one on
         `label` and on the "from outside" box — rather than a fourth way of
         writing a small heading.

         They are `h2` because this page has no heading at all: whoever moves
         by headings had nothing to move by, and these are the first. -->
    <h2 class="stats-group" data-i18n="viewer.stats.group.capture"></h2>
    <!-- The camera is not only read: it is chosen, and by the same mechanism as
         the microphone below — one `makePicker` used twice, because every defect
         the first box cost applies unchanged to the second.

         The line beside it appears only when the chosen camera is not
         connected, and then it names the one that is: **that is the one thing
         about a picture that cannot be seen by looking at it.** -->
    <div><span id="l-cam" data-i18n="viewer.stats.camera"></span>
      <span class="pick-wrap" id="s-cam-wrap"><select id="s-cam" class="pick"
              aria-labelledby="l-cam" disabled><button><selectedcontent></selectedcontent></button></select></span>
      <span id="s-cam-state" class="pick-state" hidden></span></div>
    <!-- The microphone is not only read: it is chosen.

         The box says **which one is capturing**, which is not always the one
         written in the configuration — an unplugged microphone makes the default
         one open — and changing it reopens the capture without restarting
         anything. The list arrives when the details open, not with the status
         heartbeat: enumerating the endpoints costs a COM thread, and it is not
         paid all night for a box almost nobody looks at.

         Beside it a word remains for the case where nothing is capturing: the
         box on its own would give the name of a silent microphone, which is the
         wrong trust in the worst place. -->
    <div><span id="l-mic" data-i18n="viewer.stats.microphone"></span>
      <!-- The `<button>` containing `<selectedcontent>` is the shape the
           customisable `<select>` specification expects: it is the box the
           chosen entry ends up in, and without it the long name has nowhere to
           be cut — the text leaves the control and passes under the arrow. Where
           that specification is absent, the parser **ignores** both tags (they
           are empty, so it leaves nothing behind) and the usual `<select>`
           remains. -->
      <span class="pick-wrap" id="s-mic-wrap"><select id="s-mic" class="pick"
              aria-labelledby="l-mic" disabled><button><selectedcontent></selectedcontent></button></select></span>
      <span id="s-mic-state" class="pick-state" hidden></span></div>
    <div><span data-i18n="viewer.stats.encoder"></span> <b id="s-enc">—</b></div>
    <div><span data-i18n="viewer.stats.resolution"></span> <b id="s-res">—</b></div>
    <div><span data-i18n="viewer.stats.raw"></span> <b id="s-raw">—</b></div>
    <div><span data-i18n="viewer.stats.level"></span> <b id="s-lvl">—</b></div>
    <!-- Where the picture is arriving from and who is allowed in: two
         questions about the way in, and both are asked by whoever is watching
         from outside the house. -->
    <h2 class="stats-group" data-i18n="viewer.stats.group.link"></h2>
    <!-- **"Watching now" is gone, and the strip above is the reason.** That
         count is written over the picture whenever there are two or more, and
         deliberately left blank when one is alone — "1" is the normal case and
         a number that never changes stops being read. So this row repeated, one
         panel below, a figure the eye had already been given, and what it added
         was exactly the "1" that decision calls not news.

         "Registered devices" stays, and it is a different question: those that
         can get in without retyping the password, that is, the ones "disconnect
         everybody" in the tray acts on. It is the number that gets noticed when
         somebody stays connected and should not, and nothing else on the page
         says it. The first dropped to zero by itself; this one does not. -->
    <div><span data-i18n="viewer.stats.path"></span> <b id="s-path">—</b></div>
    <div><span data-i18n="viewer.stats.devices"></span> <b id="s-dev">—</b></div>
    <!-- What this run has done since it started, the version included: it is
         the binary running now, and it is read together with the restarts by
         whoever is reporting something. -->
    <h2 class="stats-group" data-i18n="viewer.stats.group.session"></h2>
    <div><span data-i18n="viewer.stats.keyframes"></span> <b id="s-key">—</b></div>
    <div><span data-i18n="viewer.stats.keyframe-reqs"></span> <b id="s-plireq">—</b></div>
    <div><span data-i18n="viewer.stats.restarts"></span> <b id="s-restart">—</b></div>
    <div><span data-i18n="viewer.stats.dropped"></span> <b id="s-drop">—</b></div>
    <div><span data-i18n="viewer.stats.uptime"></span> <b id="s-up">—</b></div>

    <!-- The version last: it is asked for once, by whoever is reporting
         something, and it never changes while the monitor runs. It sits above
         the recordings, which stay the grid’s last cell. -->
    <div><span data-i18n="viewer.stats.version"></span> <b id="s-ver">—</b></div>

    <!-- The recordings sit **inside the details** and not on the bar: the night
         page says what is wrong and what to do now, and leafing through the
         archive is not something done one-handed in the dark. Whoever looks for
         them opens the details, which is the place for the things that are
         looked for rather than announced — and it is the grid's last cell,
         because it is the only one that leads elsewhere: the rows above are
         read, this one is pressed. -->
