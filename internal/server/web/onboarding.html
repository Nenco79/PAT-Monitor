<!-- iOS reads neither the manifest's display nor its icons on every version, so
     these two say the same thing in Apple's own words: saved to the Home Screen
     the monitor opens with no browser chrome, and it opens with the drawing
     rather than with a screenshot of whatever room was on screen. -->
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- `black` and not `black-translucent`: translucent puts the page under the
     clock, and the top of the viewer is where the alert banner and the state
     line live. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<!-- No `theme-color`: this page is the cream one, and the night ground
     would be the wrong colour while a second literal copied out of the
     palette would be the wrong idea. The browser's own default is
     right here. -->
<title data-i18n="onb.page-title"></title>
<link rel="stylesheet" href="/onboarding.css">
<link rel="stylesheet" href="/icons.css">
<link rel="stylesheet" href="/i18n.css">

<!--
  The first-configuration path.

  **Light palette, unlike the viewer, and that is not an inconsistency.** The
  monitor is watched at night on a phone, and there a dark background is a
  necessity; this page is opened once, in daylight, in front of a computer, and
  it is the first contact with the product. The full explanation is at the top of
  onboarding.css.

  **Every section is there from load and the current one is shown.** A path made
  of separate pages would have addresses of its own, but every step would cost a
  full network round precisely while Tailscale is being waited for. Where one has
  got to lives in the anchor, so the path resumes all the same: it is the
  valuable half of multi-page, without its cost.

  **No inline script.** The CSP declares `script-src 'self'`: a <script> block in
  here would not be executed, and the password form would fall back to native
  submission, putting the password in the URL.
-->

<div class="meadow" aria-hidden="true">
  <!-- xMidYMax slice: uniform scale, cropped at the sides. With
       preserveAspectRatio="none" the horizontal stretch would turn every
       rotation into a lean, and that is the second half of grass that flies.
       The viewBox is 1600 wide because with "slice" the scale follows the
       window's width: any narrower and on a large screen the blades would become
       enormous and their tips would end up outside the crop.

       Two planes, and that is what takes away the look of a fence: short, pale,
       thin blades behind, tall dark ones in front.

       **The spacings are genuinely irregular.** Blades at exactly 68 pixels from
       one another, with height and lean repeating every two, read from a
       distance as a printed pattern. Step, height, curvature and direction are
       therefore drawn once and engraved here — not computed on every load, which
       would mean different grass at every opening.

       **And the same holds for the wind.** An oscillation assigned with
       :nth-child(4n) is a second periodic pattern laid over the first: four
       blades move in unison. Duration and phase now sit on each blade. -->

  <!-- The little dog, sitting in profile facing the text.
       No outlines: at this size they stiffen the shapes and reveal how simple
       they are. The masses are separated by tone and by the fold of the hip.
       The thigh is deliberately smaller than the chest: when it was as big, the
       two read as one block and the leg disappeared.
       Rotation origins: tail 99,78 · ear 52,25 -->
  <svg viewBox="0 0 130 100" width="126" height="97"
       style="position:absolute; right:5%; bottom:0; width:126px; height:97px">
    <!-- tail, behind everything, attached to the thigh at 99,78 -->
    <g class="tail">
      <path d="M99 78c11-1 18-8 20-18" fill="none" stroke="#A97C46"
            stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- hind thigh, tucked in: a third smaller than the chest -->
    <path d="M100 91C104 82 102 66 94 60 86 54 76 56 73 66c-3 9-2 19 3 24z" fill="#BC8D53"/>
    <!-- fold of the hip: it is what separates the thigh from the body, in place of an outline -->
    <path d="M77 64c-5 7-6 16-3 23" fill="none" stroke="#A97C46" stroke-width="1.8"
          stroke-linecap="round" opacity=".65"/>

    <!-- hind foot: it comes forward from under the thigh and shares its colour —
         it is the same leg, and the darker tone keeps it distinct from the front
         one even when the two come close. The toes therefore go one tone darker,
         otherwise they would vanish into the foot. -->
    <path d="M86 92H70c-6 0-9-2-9-5s3-5 9-5h16z" fill="#BC8D53"/>
    <g stroke="#9E7038" stroke-width="1.6" stroke-linecap="round">
      <line x1="65" y1="85" x2="65" y2="90"/>
      <line x1="71" y1="84" x2="71" y2="90"/>
      <line x1="77" y1="84" x2="77" y2="90"/>
    </g>

    <!-- chest -->
    <path d="M48 88c-5-11-5-25 1-33 6-8 19-10 27-3 8 8 8 27 3 36z" fill="#CFA46C"/>

    <!-- front leg, with a clean gap from the hind foot -->

      <figcaption data-i18n="onb.s0.caption"></figcaption>
    </figure>

    <div class="note" data-i18n="onb.s0.note"></div>

    <!-- An explicit method and action are the safety net: if the script were not
         executed, the browser still submits by POST and the password does not
         end up in the address bar. -->
    <form id="pw-form" method="post" action="/api/setup" autocomplete="on">
      <label for="password" data-i18n="onb.s0.password"></label>
      <input type="password" id="password" name="password"
             autocomplete="new-password" minlength="8" required>

      <label for="confirm" data-i18n="onb.s0.confirm"></label>
      <input type="password" id="confirm" name="confirm"
             autocomplete="new-password" minlength="8" required>

      <p class="field-msg" id="pw-msg" role="status" aria-live="polite"></p>

      <div class="actions">
        <button class="btn" type="submit" id="pw-submit" data-i18n="onb.s0.submit"></button>
      </div>
    </form>

    <!-- Third state of the step: the password exists but this browser has no
         session. It is not a rare case — reopening the path from the tray after
         the cookie has expired is enough — and without this branch the page
         showed the first-configuration form, which the server refuses. Every
         later step needs the session, so this is where one signs in. -->
    <form id="pw-signin" method="post" action="/api/login" autocomplete="on" hidden>
      <ul class="results">
        <li><span class="badge ok">&#10003;</span><div><b data-i18n="onb.s0.have"></b>
          <small data-i18n="onb.s0.have-enter"></small></div></li>
      </ul>

      <label for="signin-password" data-i18n="onb.s0.password-plain"></label>

             autocomplete="current-password" required>

      <div class="actions">
        <button class="btn" type="submit" id="pw-signin-submit" data-i18n="onb.s0.enter"></button>
      </div>
    </form>

         form that will refuse their request: the step declares itself done and
         lets them through. -->
    <div id="pw-done" hidden>

        <li><span class="badge ok">&#10003;</span><div><b data-i18n="onb.s0.have"></b>

        <label for="current" data-i18n="onb.s0.current"></label>
        <input type="password" id="current" name="current"

               autocomplete="new-password" minlength="8" required>

        <input type="password" id="new-confirm" name="confirm"
               autocomplete="new-password" minlength="8" required>

    <!-- The preview is the real stream, not a thumbnail: it is the one proof the

    <div class="preview">

        <div class="vu" id="ob-vu" role="meter"

    <div class="addr with-qr">
      <div class="addr-text">
        <span class="lbl" data-i18n="onb.s3.addr"></span>
        <!-- **Not a dash.** The address arrives from Tailscale a couple of
             seconds after the phase, sometimes more, and a dash next to the
             label "address to open" reads as "there is none" rather than "it is
             on its way".

             there it is monospaced and wraps inside words, because that box is
             made for addresses. A sentence in a code box reads as a value, and

      <!-- It turns in place of the code until there is nothing to scan.
           `role="status"` because whoever cannot see the spinner has to know all
           the same that something is being waited for, and the text beside it

      <div class="qr-waiting" id="auth-qr-waiting" role="status"
           data-i18n-attr="aria-label:onb.s3.addr-waiting"><span></span></div>

    <div class="note" data-i18n-html="onb.s3.note"></div>

    <p class="small" id="auth-waiting" data-i18n="onb.s3.waiting"></p>

    <!-- The device has been created but the tailnet wants an administrator to

        <span class="lbl" data-i18n="onb.s3.devices"></span>
        <code class="block" id="approve-url">&mdash;</code>
        <div class="addr-actions">

            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6" />

            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666" />
              <path d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1" />

    <h1 data-i18n="onb.s6.title"></h1>

    <!-- **The arrival is declared, not merely reached.** Below there is
         everything one needs — addresses, code, warnings — and no line saying
         what has just happened. Whoever walked the long route has just put up a
         private network and a certificate without knowing they were doing it:
         telling them in one sentence is the only moment when it does not sound
         like boasting, because the credit is theirs. The line is composed by
         `composeFinal`, which knows which of the two routes was walked. -->
    <p class="lead" id="final-line"></p>

    <!-- **There is no illustration here, and that is a choice.** A drawing of a
         code to scan, an example address and a phone, sitting right **above**
         the two boxes that carry the real codes and the real addresses, has
         three defects in one: two addresses on the same screen, one of them
         false; a drawn code somebody can actually scan and that leads nowhere —
         an invitation to do exactly the gesture the step teaches, ending in
         nothing; and a caption the two real boxes already say, in bold, both of
         them.
         It is the camera step's rule — "the preview is the real stream, not a
         picture" — one rung further: **where the real thing is already on the
         page, its drawing does not explain it, it imitates it.** A drawing earns
         its place when it shows what cannot be seen there, like Tailscale's
         window at the authorisation step. -->

    <!-- **The code here is not a luxury, it is the only humane way.** The home
         address is a number with dots and a port: copying is no use, the phone
         is another device, and typing it by hand gets it wrong. -->
    <div class="addr with-qr">
      <div class="addr-text">
        <span class="lbl" data-i18n="onb.home"></span>
        <code class="block" id="url-home">&mdash;</code>
        <div class="addr-actions">

              <path d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1" />
            </svg><span data-i18n="onb.copy"></span></button>
        </div>

      </div>
      <img class="qr" id="home-qr" width="240" height="240"
           data-i18n-attr="alt:onb.s6.qr-home-alt">
    </div>

    <div class="addr with-qr" id="outside-block" hidden>
      <div class="addr-text">
        <span class="lbl" data-i18n="onb.away"></span>
        <code class="block" id="url-outside">&mdash;</code>
        <div class="addr-actions">
          <button class="btn ghost" type="button" data-copy="url-outside">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666" />

           data-i18n-attr="alt:onb.s6.qr-away-alt">
    </div>

    <!-- **The wait is declared before it is charged.** It is the announced-cost
         principle applied to the last screen: the address's name has to be
         registered on the Internet, and for a few minutes it does not open from
         the phone — the first time, and every time the monitor has been off for
         a while. Whoever does not know tries, it does not work, and they
         conclude that the configuration they have just finished went wrong. -->

    <h2 data-i18n="onb.s6.tray-title"></h2>

           data-i18n-attr="aria-label:onb.s6.tray-art">

             not exist. The proportions are the same as
             internal/tray/icon_windows.go, derived from rMoon as they are there

32 84h6v6h-6zM60 90h6v6h-6zM66 90h6v6h-6zM84 90h6v6h-6zM96 90h6v6h-6zM102 90h6v6h-6zM132 90h6v6h-6zM12 96h6v6h-6zM18 96h6v6h-6zM24 96h6v6h-6zM30 96h6v6h-6zM36 96h6v6h-6zM42 96h6v6h-6zM48 96h6v6h-6zM66 96h6v6h-6zM78 96h6v6h-6zM84 96h6v6h-6zM96 96h6v6h-6zM108 96h6v6h-6zM114 96h6v6h-6zM12 102h6v6h-6zM48 102h6v6h-6zM66 102h6v6h-6zM78 102h6v6h-6zM96 102h6v6h-6zM120 102h6v6h-6zM12 108h6v6h-6zM24 108h6v6h-6zM30 108h6v6h-6zM36 108h6v6h-6zM48 108h6v6h-6zM60 108h6v6h-6zM78 108h6v6h-6zM90 108h6v6h-6zM96 108h6v6h-6zM102 108h6v6h-6zM108 108h6v6h-6zM132 108h6v6h-6zM12 114h6v6h-6zM24 114h6v6h-6zM30 114h6v6h-6zM36 114h6v6h-6zM48 114h6v6h-6zM60 114h6v6h-6zM72 114h6v6h-6zM78 114h6v6h-6zM84 114h6v6h-6zM90 114h6v6h-6zM108 114h6v6h-6zM120 114h6v6h-6zM132 114h6v6h-6zM12 120h6v6h-6zM24 120h6v6h-6zM30 120h6v6h-6zM36 120h6v6h-6zM48 120h6v6h-6zM66 120h6v6h-6zM72 120h6v6h-6zM78 120h6v6h-6zM90 120h6v6h-6zM102 120h6v6h-6zM108 120h6v6h-6zM114 120h6v6h-6zM120 120h6v6h-6zM132 120h6v6h-6zM12 126h6v6h-6zM48 126h6v6h-6zM66 126h6v6h-6zM72 126h6v6h-6zM78 126h6v6h-6zM84 126h6v6h-6zM90 126h6v6h-6zM120 126h6v6h-6zM126 126h6v6h-6zM12 132h6v6h-6zM18 132h6v6h-6zM24 132h6v6h-6zM30 132h6v6h-6zM36 132h6v6h-6zM42 132h6v6h-6zM48 132h6v6h-6zM72 132h6v6h-6zM90 132h6v6h-6zM96 132h6v6h-6zM102 132h6v6h-6zM108 132h6v6h-6zM114 132h6v6h-6z"/>

          <rect x="12" y="346" width="236" height="40" rx="20"
                fill="#E5DFD3" stroke="#D3C9B6" stroke-width="1"/>
          <text x="130" y="371" text-anchor="middle" font-size="14" font-weight="500"
                fill="#6A6256" data-i18n-plain="tray.menu.revoke"></text>

          <!-- **Two folders are two glyphs, and the word stays on the control.**
               In the panel these two carry no label: they are the same set's
               `video` and `file-text`, and what tells them apart is what is
               inside the folder, not the word "folder" written twice. The `d`
               strings are the ones in internal/tray/glyph_windows.go, and the
               glyph is 20 in a button of 40. -->
          <g fill="none" stroke="#6A6256" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <rect x="12" y="392" width="115" height="40" rx="20"
                  fill="#E5DFD3" stroke="#D3C9B6" stroke-width="1"/>
            <g transform="translate(59.5 402) scale(.8333)">
              <path d="M15 10l4.553 -2.276a1 1 0 0 1 1.447 .894v6.764a1 1 0 0 1 -1.447 .894l-4.553 -2.276v-4z"/>
              <path d="M3 6m0 2a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z"/>
            </g>
            <rect x="133" y="392" width="115" height="40" rx="20"
                  fill="#E5DFD3" stroke="#D3C9B6" stroke-width="1"/>
            <g transform="translate(180.5 402) scale(.8333)">
              <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
              <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/>
              <path d="M9 9l1 0"/>
              <path d="M9 13l6 0"/>
              <path d="M9 17l6 0"/>
            </g>
          </g>

          <rect x="12" y="438" width="236" height="40" rx="20"
                fill="#E5DFD3" stroke="#D3C9B6" stroke-width="1"/>
          <text x="130" y="463" text-anchor="middle" font-size="14" font-weight="500"
                fill="#6A6256" data-i18n-plain="tray.menu.quit"></text>
        </g>

        <!-- Windows' taskbar, and its colours are its own: this is somebody
             else's interface, and making it follow our palette would mean
             repainting it. The panel above sits over the icon, which is where
             the right button opens it. -->
        <rect x="0" y="502" width="340" height="34" rx="7" fill="#E3DACA" stroke="#D3C9B6" stroke-width="1"/>
        <circle cx="210" cy="519" r="7" fill="#8C8474" opacity=".4"/>
        <circle cx="238" cy="519" r="7" fill="#8C8474" opacity=".4"/>
        <use href="#ico-tray" transform="translate(266 508) scale(.9167)" fill="#4F7F31"/>
        <!-- As above: the clock in Windows' taskbar. -->
        <text x="330" y="524" text-anchor="end" fill="#7A7264" font-size="12">14:32</text>
      </svg>
      <figcaption data-i18n="onb.s6.tray-caption"></figcaption>
    </figure>

    <div class="note warn" data-i18n-html="onb.s6.who-enters"></div>

    <!-- **What the monitor is not, said once at the arrival.** Whoever is here
         has just set it up and is about to rely on it, which is the moment the
         limit has to be read: no medical device, no safety system, it can miss
         a sound or a movement, and it calls nobody. It is a fact with no
         promise in it, and the same sentence stands on the sign-in page and at
         the foot of the details. -->
    <p class="small" data-i18n="safety.notice"></p>

    <div class="actions">
      <a class="btn" id="go-to-monitor" href="/" data-i18n="onb.s6.open"></a>
    </div>
  </section>

  <!-- ============ E · failure ============ -->
  <section class="step stop" data-step="7">
    <p class="eyebrow" data-i18n="onb.s7.eyebrow"></p>
    <h1 data-i18n="onb.s7.title"></h1>

    <figure class="art">
      <svg viewBox="0 0 520 152" role="img"
           data-i18n-attr="aria-label:onb.s7.art">

    </div>
  </section>
</div>

<!-- ============ the explainer, for whoever looks for it ============
     Explaining the meeting point to everybody costs everybody a screen to serve
     the few per cent who want it; the three things that actually decide — free,
     no new password, router untouched — stay in the clear on the fork.
     It is a `<dialog>` and not a ninth section on purpose: opening it does not
     move the path, so there is no extra state to come back from, and the bar at
     the top goes on telling the truth. -->
<dialog id="explainer" aria-labelledby="explainer-h">
  <div class="explainer-body">
    <h2 id="explainer-h" data-i18n="onb.how-full"></h2>
    <p data-i18n-html="onb.exp.vpn"></p>

    <figure class="art">
      <svg viewBox="0 20 520 236" role="img"
           data-i18n-attr="aria-label:onb.exp.art">
        <!-- The house is always the same in every illustration: 72x68, roof with
             9 of eave each side, indicator centred at 36,47. Here it is in its
             reference position, with the local origin at 40,145. -->
        <g transform="translate(40 145)">
          <path d="M0 27L36 0L72 27" fill="none" stroke="#8C8474" stroke-width="3" stroke-linejoin="round"/>
          <rect x="9" y="27" width="54" height="41" rx="5" fill="#FBF8F2" stroke="#8C8474" stroke-width="3"/>
          <circle cx="36" cy="47" r="9" fill="#E5DFD3" stroke="#17706E" stroke-width="2.5"/>
          <circle cx="36" cy="47" r="3.5" fill="#17706E" class="breathe"/>
        </g>
        <text x="76" y="236" text-anchor="middle" font-size="13"
              data-i18n="onb.exp.art-monitor"></text>

        <rect x="418" y="158" width="42" height="70" rx="9" fill="#FBF8F2" stroke="#8C8474" stroke-width="3"/>
        <rect x="432" y="165" width="14" height="3" rx="1.5" fill="#8C8474"/>
        <circle cx="439" cy="218" r="3.5" fill="#8C8474"/>
        <text x="439" y="244" text-anchor="middle" font-size="13"
              data-i18n="onb.exp.art-viewer"></text>

        <!-- The two arcs go inside the cloud instead of stopping at its edge,
             and the cloud is drawn afterwards: so it covers them, and the
             traffic disappears behind the meeting point instead of arriving
             beside it. For the same reason the moving dots are up here too. -->
        <path d="M118 162C152 128 186 96 244 76" fill="none" stroke="#3C5CA8" stroke-width="2.5"
              stroke-linecap="round" opacity=".4"/>
        <path d="M414 154C378 118 330 88 276 76" fill="none" stroke="#3C5CA8" stroke-width="2.5"
              stroke-linecap="round" opacity=".4"/>
        <circle r="4" fill="#3C5CA8" class="travel"
                style="offset-path: path('M118 162C152 128 186 96 244 76')"/>
        <circle r="4" fill="#3C5CA8" class="travel d2"
                style="offset-path: path('M414 154C378 118 330 88 276 76')"/>

        <path d="M206 60a34 34 0 0 1 66-11 28 28 0 0 1 38 26 24 24 0 0 1-6 47H214a30 30 0 0 1-8-62z"
              fill="#F1ECE2" stroke="#3C5CA8" stroke-width="2.5"/>
        <!-- **253 and not 262, nor 260.** The cloud is not symmetrical and is
             not centred in the frame: sampling the outline, at the caption's
             height it runs from 179.0 to 327.2, so the middle is 253.1. By eye
             one is nine units out to the right, which on this drawing is ten
             pixels. The height 96 is right, though: it is below the geometric
             centre, but the left hump falls and the right one rises, and the eye
             follows the mass. -->
        <text x="253" y="96" text-anchor="middle" fill="#3C5CA8" font-size="13"
              data-i18n="onb.exp.art-meeting"></text>

        <path d="M124 204h276" fill="none" stroke="#4F7F31" stroke-width="6.5"
              stroke-linecap="round" opacity=".5"/>
        <circle cx="124" cy="204" r="4.5" fill="#4F7F31" class="glide" style="--d:276px"/>
        <circle cx="124" cy="204" r="4.5" fill="#4F7F31" class="glide d2" style="--d:276px"/>
        <text x="262" y="192" text-anchor="middle" fill="#4F7F31" font-size="13"
              data-i18n="onb.exp.art-direct"></text>
      </svg>
      <figcaption data-i18n="onb.exp.caption"></figcaption>
    </figure>

    <p data-i18n-html="onb.exp.short-road"></p>

    <h3 data-i18n="onb.exp.also-title"></h3>
    <p data-i18n="onb.exp.also-body"></p>
  </div>
  <form method="dialog" class="explainer-close">
    <button class="btn ghost" data-i18n="onb.exp.got-it"></button>
  </form>
</dialog>

<script src="/dictionary.js"></script>
<script src="/i18n.js"></script>
<script src="/onboarding.js"></script>
</body>
</html>
