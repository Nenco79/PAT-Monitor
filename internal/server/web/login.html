<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<!-- iOS reads neither the manifest's display nor its icons on every version, so
     these two say the same thing in Apple's own words: saved to the Home Screen
     the monitor opens with no browser chrome, and it opens with the drawing
     rather than with a screenshot of whatever room was on screen. -->
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- `black` and not `black-translucent`: translucent puts the page under the
     clock, and the top of the viewer is where the alert banner and the state
     line live. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#171512">
<title data-i18n="login.title"></title>
<link rel="stylesheet" href="/style.css">
<!-- icons.css here too, although this page has no glyphs: `style.css` is the
     viewer's own sheet, and some of its rules read `--gap-ico`, which is
     declared in there. A missing token does not protest — its line simply
     becomes invalid, like `--radius-s` in the language selector — so the first
     button with an icon added here would come out with the glyph stuck to the
     word, and nothing would say so. -->
<link rel="stylesheet" href="/icons.css">
<link rel="stylesheet" href="/i18n.css">
</head>

<div class="center">
  <!-- An explicit method="post" and action: if the script did not run, the
       browser still sends a POST and the password does not end up in the
       address. -->
  <form class="card" id="form" data-mode="login"
        method="post" action="/api/login" autocomplete="on">
    <h1>PAT Monitor</h1>
    <p class="sub" data-i18n="login.subtitle"></p>

    <label for="password" data-i18n="login.password"></label>
    <input type="password" id="password" name="password"
           autocomplete="current-password" required autofocus>

    <button type="submit" id="submit" data-i18n="login.submit"></button>
    <p class="msg" id="msg"></p>
    <!-- The sign-in is the one page everybody who watches passes through,
         including whoever never saw the guided setup: the limit is said here
         too. See onboarding.html, where it is argued. -->
    <p class="hint" data-i18n="safety.notice"></p>
  </form>
</div>
