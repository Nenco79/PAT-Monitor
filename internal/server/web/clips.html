<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<!-- iOS reads neither the manifest's display nor its icons on every version, so
     these two say the same thing in Apple's own words: saved to the Home Screen
     the monitor opens with no browser chrome, and it opens with the drawing
     rather than with a screenshot of whatever room was on screen. -->
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- `black` and not `black-translucent`: translucent puts the page under the
     clock, and the top of the viewer is where the alert banner and the state
     line live. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#171512">
<title>PAT Monitor</title>
<!-- The viewer's own sheets, not one of its own: this page is its continuation
     and inherits its dark palette. A second sheet to keep in step has already
     cost `--t-h1` written 28 in one and 24 in the other. -->
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/icons.css">
</head>
<body>

<!-- The glyphs live **in the markup**, as on the other two pages, and not inside
     the code: here, though, the rows are built from JavaScript, so they are
     cloned from these templates rather than written by hand one per row.

     They are Tabler Icons v3.46.0, MIT, pasted verbatim: `download`, `trash`,
     `star`, `check`, `arrow-back-up`, `x`, and the viewer bar's `dog`, `walk` and
     `mood-cry`, which are the same drawings as on the switches that produce
     those clips. The licence is already in `licenses/manually-added/tabler-icons/`.
     The dot of a clip asked for by hand is the "Clip" button's, and ours. -->
<template id="i-download">
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" />
    <path d="M7 11l5 5l5 -5" /><path d="M12 4l0 12" />
  </svg>
</template>
<template id="i-delete">
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 7l16 0" /><path d="M10 11l0 6" /><path d="M14 11l0 6" />
    <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
    <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
  </svg>
</template>
<template id="i-star">
  <svg class="ico i-star" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873l-6.158 -3.245" />
  </svg>
</template>
<template id="i-undo">
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M9 14l-4 -4l4 -4" /><path d="M5 10h11a4 4 0 1 1 0 8h-1" />
  </svg>
</template>
<template id="i-check">
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M5 12l5 5l10 -10" />
  </svg>
</template>
<template id="i-close">
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M18 6l-12 12" /><path d="M6 6l12 12" />
  </svg>
</template>
<template id="i-bark">
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M11 5h2" />
    <path d="M19 12c-.667 5.333 -2.333 8 -5 8h-4c-2.667 0 -4.333 -2.667 -5 -8" />
    <path d="M11 16c0 .667 .333 1 1 1s1 -.333 1 -1h-2" />
    <path d="M12 18v2" />
    <path d="M10 11v.01" />
    <path d="M14 11v.01" />
    <path d="M5 4l6 .97l-6.238 6.688a1.021 1.021 0 0 1 -1.41 .111a.953 .953 0 0 1 -.327 -.954l1.975 -6.815" />
    <path d="M19 4l-6 .97l6.238 6.688c.358 .408 .989 .458 1.41 .111a.953 .953 0 0 0 .327 -.954l-1.975 -6.815" />
  </svg>
</template>
<template id="i-motion">
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 4a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
    <path d="M7 21l3 -4" />
    <path d="M16 21l-2 -4l-3 -3l1 -6" />
    <path d="M6 12l2 -3l4 -1l3 3l3 1" />
  </svg>
</template>
<template id="i-cry">
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M9 10l.01 0" />
    <path d="M15 10l.01 0" />
    <path d="M9.5 15.25a3.5 3.5 0 0 1 5 0" />
    <path d="M17.566 17.606a2 2 0 1 0 2.897 .03l-1.463 -1.636l-1.434 1.606" />
    <path d="M20.865 13.517a8.937 8.937 0 0 0 .135 -1.517a9 9 0 1 0 -9 9c.69 0 1.36 -.076 2 -.222" />
  </svg>
</template>
<template id="i-manual">
  <svg class="ico i-dot" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="7" />
  </svg>
</template>

<div class="viewer clips">
  <div class="clips-head">
    <a class="ghost" id="back" href="/">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" />
      </svg><span data-i18n="clips.back"></span></a>
    <!-- The summary sits by the name of the page, where the eye already is —
         beside it where there is room, under it where there is not: at the
         foot of the list it was the last line of a page nobody scrolls to the
         end of. -->
    <div class="clips-title">
      <h1 data-i18n="clips.title"></h1>
      <p class="clips-note" id="note"></p>
    </div>
  </div>

  <!-- There is **one** player, and it sits at the top: a row is pressed and the
       clip loads here. One player per row would be one connection per row, and
       over twenty clips through the funnel that is not a nuance.

       Hidden until something is chosen: a black rectangle above an empty list
       reads as a fault. -->
  <div class="clips-player" id="player" hidden>
    <video id="clip" controls playsinline preload="metadata"></video>
    <!-- **One line under the video: which clip, and what can be done to it.**
         The commands used to sit on every row, then on a row of their own
         under a line of their own; Keep is the row's star alone, and what is
         left here is Download and Delete, Delete last. It is not confirmed:
         it can be taken back for a few seconds, from the notice at the bottom. -->
    <div class="clips-playing">
      <span class="clips-playing-what"><span id="playing-when"></span><span id="playing-what"></span></span>
      <a class="ghost" id="player-download"></a>
      <button class="ghost danger" id="player-delete" type="button"></button>
    </div>
  </div>

  <!-- The codec panel: it appears **only** if the browser declares it cannot
       play what we write. It applies to Safari before iOS 17, which does not
       play Opus audio inside MP4. Conditions that depend on the viewer's
       browser are shown: nobody reads them inside the console. -->
  <p class="warnbox" id="codec" data-i18n="clips.codec"></p>

  <p class="clips-empty" id="empty" hidden data-i18n="clips.empty"></p>
  <p class="warnbox" id="error" role="alert"></p>

  <!-- The filters sit over the list, not over the player. -->
  <div class="clips-tools" id="tools" hidden>
    <!-- One filter per kind of clip in the list, built by clips.js: which kinds
         there are is the clips' business, not the page's. -->
    <div class="clips-filters" id="filters" role="group" hidden
         data-i18n-attr="aria-label:clips.filters"></div>
  </div>

  <!-- One section per day, each a heading and its list: built by clips.js,
       because the days are the clips' and not the page's. -->
  <div class="clips-days" id="list" tabindex="-1"></div>

  <!-- Acting on several clips at once is a mode, not a row of checkboxes
       always on screen. "Select" sits on the first day's heading, where
       clips.js puts it, and while selecting "Cancel" takes its place there:
       the way out is where the way in was. -->
  <button class="ghost clips-select" id="select" type="button" hidden></button>
  <button class="ghost clips-select" id="sel-cancel" type="button" hidden></button>

</div>

<!-- The notice that takes a delete back. What it says is announced by the
     region under it, which is always in the page: a live region that appears
     together with its words is not heard by most screen readers. -->
<div class="clips-say" id="toast-say" role="status"></div>
<!-- While selecting, what is chosen and what can be done to it float at the
     foot of the screen, in reach wherever the list has been scrolled to: the
     same three things as for one clip, Delete last. -->
<div class="clips-selbar" id="selcmds" hidden>
  <span id="sel-count"></span>
  <button class="ghost" id="sel-download" type="button"></button>
  <button class="ghost toggle" id="sel-keep" type="button" aria-pressed="false"></button>
  <button class="ghost danger" id="sel-delete" type="button"></button>
</div>
<div class="clips-toast" id="toast" hidden>
  <span id="toast-text"></span>
  <button class="ghost" id="toast-undo" type="button"></button>
</div>
<script src="/dictionary.js"></script>
<script src="/i18n.js"></script>
<script src="/page.js"></script>
<script src="/clips.js"></script>
</body>
</html>
