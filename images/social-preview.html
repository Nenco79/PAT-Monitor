<!DOCTYPE html>
<!-- The social preview of Nenco79/PAT-Monitor, 1280x640, and the source of the
     social-preview.png beside it.

     **The PNG is here because it is uploaded by hand.** It goes in Settings ->
     General -> Social preview and GitHub then serves it from its own CDN, so
     nothing in this repository reads either file. What is committed is the way
     to make the image again: a PNG without its source is a file nobody can
     change.

     Self-contained on purpose -- no script, no external sheet, every value
     inline. Open it in a browser and export the 1280x640 box.

     The icon is the transcription of internal/icon/drawing.go, the same
     `0 0 130 100` viewBox and the same 0.72 of the side, and the four dots are
     the night tints of internal/server/web/style.css. Neither is a colour
     chosen here, so if either moves this file is what goes stale with nobody
     saying so.

     GitHub's safe margin is 80px on every side and nothing is drawn inside it:
     whoever unfurls the link crops it, and each of them crops differently. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PAT Monitor — social preview</title>
</head>
<body style="margin:0;background:#201E1D;display:grid;place-items:center;min-height:100vh">
<div style="position:relative;width:1280px;height:640px;background:#E5DFD3;overflow:hidden;font:400 16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;color:#2E2A24">
  <div style="position:absolute;inset:0;padding:104px;box-sizing:border-box;display:grid;grid-template-columns:1fr 400px;gap:120px;align-items:center">
    <div>
      <p style="margin:0 0 18px;display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:18px;line-height:1;letter-spacing:.14em;text-transform:uppercase;color:#17706E"><span style="width:12px;height:12px;border-radius:50%;background:#17706E"></span>Nenco79 / PAT-Monitor</p>
      <h1 style="margin:0 0 20px;font-weight:600;font-size:76px;line-height:1.04;letter-spacing:-.035em;color:#2E2A24">PAT Monitor</h1>
      <p style="margin:0 0 28px;font-weight:400;font-size:28px;line-height:1.4;color:#574F44;max-width:21ch;text-wrap:balance">Pet and baby monitor for Windows.</p>
      <p style="margin:0;font-weight:400;font-size:20px;line-height:1.5;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#6A6256">Go · WebRTC · Tailscale · CED-tiny</p>
    </div>
    <div style="position:absolute;left:50%;top:50%;width:152px;height:152px;transform:translate(-50%,-50%);filter:drop-shadow(0 12px 32px #2E2A2440)">
      <svg viewBox="0 0 100 100" width="152" height="152" aria-label="PAT Monitor icon">
        <circle cx="50" cy="50" r="48" fill="#17706E"></circle>
        <g transform="translate(-3.57,0.48) scale(1.353)">
          <ellipse cx="45" cy="36" rx="20" ry="18" fill="#CFA46C"></ellipse>
          <path d="M52 25c9-1 15 8 14 19c-1 8-6 12-12 11z" fill="#9E7038"></path>
          <ellipse cx="28" cy="43" rx="13" ry="10" fill="#E7CFA5"></ellipse>
          <ellipse cx="18" cy="40" rx="5" ry="4" fill="#443628"></ellipse>
          <path d="M22 47c0 4 3 6 6 6" fill="none" stroke="#443628" stroke-width="2" stroke-linecap="round"></path>
          <circle cx="40" cy="32" r="3.4" fill="#33291D"></circle>
          <circle cx="41.3" cy="30.8" r="1.1" fill="#FBF8F2"></circle>
        </g>
      </svg>
    </div>
    <div style="background:#211E1A;border-radius:24px;padding:32px">
      <div style="display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid #322D26">
        <span style="width:26px;height:26px;border-radius:50%;flex:none;background:#3FA8A4"></span>
        <span style="flex:1;font-weight:500;font-size:22px;line-height:1.2;color:#F0EBE2">Live video and audio</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid #322D26">
        <span style="width:26px;height:26px;border-radius:50%;flex:none;background:#7B93D8"></span>
        <span style="flex:1;font-weight:500;font-size:22px;line-height:1.2;color:#F0EBE2">From anywhere, no cloud</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid #322D26">
        <span style="width:26px;height:26px;border-radius:50%;flex:none;background:#7FC45A"></span>
        <span style="flex:1;font-weight:500;font-size:22px;line-height:1.2;color:#F0EBE2">Crying, barking, motion</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;padding:16px 0">
        <span style="width:26px;height:26px;border-radius:50%;flex:none;background:#E0A340"></span>
        <span style="flex:1;font-weight:500;font-size:22px;line-height:1.2;color:#F0EBE2">Event clips with pre-roll</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
