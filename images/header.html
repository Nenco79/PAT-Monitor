<!DOCTYPE html>
<!-- The repository header at the top of README.md: 1400x300, and the source of
     the header.png beside it.

     Rounded at the top, square at the bottom, because in the README the strip
     sits against the text that follows: the bottom edge is where the page
     continues, and there is nothing there to round away from.

     **The corners must stay transparent, and that is what the export has to get
     right.** A rounded corner does not paint its four corner pixels -- it leaves
     whatever is behind the box -- so an export over a coloured ground bakes that
     colour in, and the first version of this file did exactly that: two dark
     notches in a README that GitHub renders on white. Hence `background:
     transparent` on the body here, and an export that keeps the alpha channel:
     `--default-background-color=00000000` in headless Edge. Empty corners are
     right on both of GitHub's themes; white ones are right on one.

     Self-contained -- no script, no external sheet, every value inline. Open it
     in a browser and export the 1400x300 box.

     Same tokens as the card: ground #E5DFD3, ink #2E2A24, teal #17706E,
     monospace #6E6659. The icon is the transcription of internal/icon/drawing.go,
     the same `0 0 130 100` viewBox and the same 0.72 of the side, so it is not a
     colour or a shape chosen here: if the drawing moves, this file is what goes
     stale with nobody saying so. -->

<head>
<meta charset="utf-8">
<title>PAT Monitor — repository header</title>
</head>

  <div style="flex:none;width:164px;height:164px">

      <circle cx="50" cy="50" r="48" fill="#17706E"></circle>
      <g transform="translate(-3.57,0.48) scale(1.353)">
        <ellipse cx="45" cy="36" rx="20" ry="18" fill="#CFA46C"></ellipse>

</html>
