# Format, vet, the suite, and that build.ps1 still produces a binary; then the
# suite a second time under the race detector, and the known vulnerabilities in
# what is linked in, each in a job of its own.
#
# Windows only, and that is not an omission: the capture is Media Foundation and
# WASAPI, most tests carry //go:build windows, and on anything else the tree
# builds almost nothing and proves less.
#
# Releases are not cut here: `build.ps1 -Publish` cuts them on the machine that
# holds the signing key, and the reason is written there.
name: check

on:
  push:
    branches: [main]
  workflow_dispatch:
  # No pull_request trigger: pull requests are turned off on this repository.
  # Adding one here would be a job that never runs, which reads as coverage.

  # **Once a week whether or not anybody pushed**, because two things change
  # while this repository is still: the list of known vulnerabilities, and the
  # runner's image. A push is the wrong clock for both, and between 1.5.0 and
  # the commit that added this line six weeks went by with nothing run.
  #
  # **It watches a quiet spell, not an abandoned repository.** GitHub switches
  # a schedule off in a public repository after sixty days with no activity in
  # it, and says so by e-mail first. A commit, or pressing the button again,
  # brings it back.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# The actions are named by major tag and not pinned to a commit, and that is a
# decision. A pin buys protection against a tag moved under us, and what a
# moved tag could reach here is a read-only token and a test run: no secret is
# in this workflow and no release is built by it. A pin nobody updates ages
# into an old action run for ever, which is the cost that would be paid.

jobs:
  check:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing after the checkout talks to GitHub, so the token is not
          # left in the repository's git config for the steps that follow.
          persist-credentials: false
          # **Not the default of 1.** The build stamps the commit count into the
          # binary as `r`, and in a shallow clone `git rev-list --count` answers
          # 1 — with no error, on every build, for ever. An identifier that lies
          # is worse than no identifier, and this is the shape it takes here.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # gofmt exits 0 whether or not it found anything: it prints the files and
      # says nothing else, so the check is on the output and not on the status.
      # Measured rather than assumed.
      - name: gofmt
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) { $bad; throw "the files above are not gofmt'd" }

      - name: vet
        run: go vet ./...

      # The suite carries the guards this project relies on: the index against
      # the chapters, the README against the tree, the catalogues against the
      # codes, the sweep that refuses a bare `go` statement, the licence folder
      # against what is linked in.
      - name: test
        run: go test ./...

      # Not `go build`: build.ps1 stamps the version and the Tailscale node
      # version through the linker and generates the icon resource, so building
      # any other way tests something the product is not.
      #
      # **`powershell` and not `pwsh`, deliberately**, and it is the only step
      # here that cares. They are two parsers: `pwsh` is PowerShell 7 and reads
      # a BOM-less file as UTF-8, Windows PowerShell 5.1 reads it as ANSI — and
      # build.ps1 has no BOM, so a multi-byte character inside one of its
      # strings is a parse error on 5.1 and nothing at all on 7. The machine
      # that runs this script is on 5.1, so a check on 7 would stay green over a
      # script that does not start.
      - name: build
        shell: powershell
        run: .\build.ps1

  # The suite again, under Go's race detector.
  #
  # **A job of its own, because it is the one place cgo is switched on.** The
  # detector wants cgo and a C compiler; the machine this is written on has no
  # compiler, which is why two chapters of the record say the detector cannot
  # be used there. The runner has a gcc. What ships is still built above with
  # CGO_ENABLED=0: this job builds test binaries and throws them away.
  #
  # Its first run found one race, in a test that read the log while a timer
  # wrote it, and none in the product.
  #
  # **It cannot pass by not looking**, and that was measured rather than
  # assumed: with cgo off the go command answers `-race requires cgo`, and with
  # cgo on and no compiler `C compiler "gcc" not found`, each a failed build
  # and not a run without the detector. So a runner image that loses its gcc
  # turns this red, not quietly green.
  #
  # `-race` also turns on checkptr, so a conversion through unsafe.Pointer that
  # the plain suite walks past stops the test here. In the packages that talk
  # to COM that is a second thing being asked, and it is wanted.
  #
  # What it does not see is what no test runs: a race between the capture and a
  # viewer needs a camera, and there is none on a runner.
  race:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # As above, so that a test asking git about the tree is answered the
          # same in both jobs.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: test under the race detector
        run: go test -race ./...

  # Known vulnerabilities, in the code this program can actually reach.
  #
  # The monitor answers on the Internet from somebody else's house, through
  # tsnet, pion and x/crypto, and a release already installed does not learn of
  # an advisory published after it. Somebody has to: this is that somebody, and
  # the schedule above is what makes it look when nobody is here.
  #
  # **govulncheck and not a list of modules**, because it follows the calls: an
  # advisory in a function nothing here reaches is printed and does not fail,
  # one in a function we call exits 3. With a module graph this size a check on
  # versions alone would be red most weeks over code that is not linked in,
  # and a guard that is always red is read as one that is always green.
  #
  # **`go run` at a version is not a dependency**: it resolves outside go.mod
  # and leaves it and go.sum as they were. `@latest` for the same reason the
  # actions are not pinned: it reads the tree with a read-only token, and an
  # old pinned scanner is one that knows old advisory formats.
  #
  # It also reads the Go version in go.mod as the standard library's, so an
  # advisory fixed in a later patch release of Go turns this red until go.mod
  # moves. That is the answer wanted, since that toolchain is what links the
  # release.
  vulns:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
